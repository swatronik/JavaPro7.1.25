# 1. Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: quota-lab
---
# 2. ResourceQuota
apiVersion: v1
kind: ResourceQuota
metadata:
  name: lab-quota
  namespace: quota-lab
spec:
  hard:
    pods: "2"
    requests.memory: "400Mi"
    limits.memory: "600Mi"
---
# 3. LimitRange
apiVersion: v1
kind: LimitRange
metadata:
  name: lab-limits
  namespace: quota-lab
spec:
  limits:
    - type: Container
      min:
        memory: "100Mi"
      max:
        memory: "300Mi"
      default:
        memory: "200Mi"
      defaultRequest:
        memory: "200Mi"
---
# 4. Pod без ресурсов
apiVersion: v1
kind: Pod
metadata:
  name: pod-no-resources
  namespace: quota-lab
spec:
  containers:
    - name: test-container
      image: busybox:1.36
      command: ["sleep", "999999"]
---
# 5. Pod с маленьким request (50Mi)
apiVersion: v1
kind: Pod
metadata:
  name: pod-small-request
  namespace: quota-lab
spec:
  containers:
    - name: test-container
      image: busybox:1.36
      command: ["sleep", "999999"]
      resources:
        requests:
          memory: "50Mi"
---
# 6. Pod с большим limit (500Mi)
apiVersion: v1
kind: Pod
metadata:
  name: pod-big-limit
  namespace: quota-lab
spec:
  containers:
    - name: test-container
      image: busybox:1.36
      command: ["sleep", "999999"]
      resources:
        limits:
          memory: "500Mi"
---
# 7. Pod с request > limit
apiVersion: v1
kind: Pod
metadata:
  name: pod-invalid
  namespace: quota-lab
spec:
  containers:
    - name: test-container
      image: busybox:1.36
      command: ["sleep", "999999"]
      resources:
        requests:
          memory: "300Mi"
        limits:
          memory: "200Mi"
---
# 8. Pod 1
apiVersion: v1
kind: Pod
metadata:
  name: pod-1
  namespace: quota-lab
spec:
  containers:
    - name: test-container
      image: busybox:1.36
      command: ["sleep", "999999"]
      resources:
        requests:
          memory: "150Mi"
        limits:
          memory: "250Mi"
---
# 9. Pod 2
apiVersion: v1
kind: Pod
metadata:
  name: pod-2
  namespace: quota-lab
spec:
  containers:
    - name: test-container
      image: busybox:1.36
      command: ["sleep", "999999"]
      resources:
        requests:
          memory: "150Mi"
        limits:
          memory: "250Mi"
---
# 10. Pod 3 превысит квоту
apiVersion: v1
kind: Pod
metadata:
  name: pod-3
  namespace: quota-lab
spec:
  containers:
    - name: test-container
      image: busybox:1.36
      command: ["sleep", "999999"]
      resources:
        requests:
          memory: "150Mi"
        limits:
          memory: "250Mi"