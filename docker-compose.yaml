version: '3'
services:

  db:
    image: postgres:17.6
    container_name: 'postgres'
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata
      - TZ='GMT+3'
      - PGTZ='GMT+3'
    networks:
      - gateway
    restart: always
    ports:
      - '5432:5432'
    volumes:
      - postgresdb:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  paymentlimit:
    hostname: paymentlimit
    build:
      context: .
      dockerfile: payment_limit/Dockerfile
    container_name: 'paymentlimit'
    restart: always
    networks:
      - gateway
    ports:
      - '8084:8084'
    depends_on:
      db:
        condition: service_healthy
    links:
      - db
    healthcheck:
      test: "curl --fail --silent localhost:8084/actuator/health | grep UP || exit 1"
      interval: 5s
      timeout: 5s
      retries: 10

  payment:
    hostname: payment
    build:
      context: .
      dockerfile: payment/Dockerfile
    container_name: 'payment'
    restart: always
    networks:
      - gateway
    ports:
      - '8085:8085'
    depends_on:
      db:
        condition: service_healthy
      paymentlimit:
        condition: service_healthy
    links:
      - db
      - paymentlimit
    healthcheck:
      test: "curl --fail --silent localhost:8085/actuator/health | grep UP || exit 1"
      interval: 5s
      timeout: 5s
      retries: 10

  main:
    hostname: main
    build:
      context: .
      dockerfile: main/Dockerfile
    container_name: 'main'
    networks:
      - gateway
    ports:
      - '8082:8082'
    depends_on:
      payment:
        condition: service_healthy
    links:
      - payment

volumes:
  postgresdb:

networks:
  gateway: {}
