version: '3'
services:

  db:
    image: postgres:17.6
    container_name: 'postgres'
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata
      - TZ='GMT+3'
      - PGTZ='GMT+3'
    networks:
      - gateway
    restart: always
    ports:
      - '5432:5432'
    volumes:
      - postgresdb:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: 'docker-spring-boot-postgres:latest'
    hostname: app
    build:
      context: .
      dockerfile: main/Dockerfile
    container_name: 'app'
    restart: always
    networks:
      - gateway
    ports:
      - '8081:8081'
    depends_on:
      db:
        condition: service_healthy
    links:
      - db
    healthcheck:
      test: "curl --fail --silent localhost:8081/actuator/health | grep UP || exit 1"
      interval: 5s
      timeout: 5s
      retries: 10

  payment:
    hostname: payment
    build:
      context: .
      dockerfile: payment/Dockerfile
    container_name: 'payment'
    networks:
      - gateway
    ports:
      - '8082:8082'
    depends_on:
      app:
        condition: service_healthy
    links:
      - app

volumes:
  postgresdb:

networks:
  gateway: {}
